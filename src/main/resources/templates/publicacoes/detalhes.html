<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Círculo - Detalhes da publicação</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/estilo.css}" rel="stylesheet">
</head>
<body>

<nav th:replace="~{fragments :: navbar}"></nav>
<div th:replace="~{fragments :: alerts}"></div>

<div class="container">
    <div class="card shadow-sm mx-auto" style="max-width: 700px;">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-start mb-2">
                <span class="badge rounded-pill text-bg-light border"
                      th:text="${#strings.replace(publicacao.categoria, '_', ' ')}">Categoria</span>
                <span th:switch="${publicacao.status}">
                    <span th:case="'PUBLICADA'" class="badge bg-success">Publicada</span>
                    <span th:case="'RASCUNHO'" class="badge bg-secondary">Rascunho</span>
                    <span th:case="'ARQUIVADA'" class="badge bg-dark">Arquivada</span>
                </span>
            </div>

            <h3 th:text="${publicacao.titulo}">Título da publicação</h3>
            <p class="text-muted mb-3">
                Por <strong th:text="${publicacao.anonima} ? 'Anônima' : publicacao.autora">Autora</strong>
                &middot;
                <span th:text="${#temporals.format(publicacao.dataPublicacao, 'dd/MM/yyyy HH:mm')}">25/09/2026</span>
            </p>

            <p style="white-space: pre-line;" th:text="${publicacao.conteudo}">Conteúdo da publicação...</p>

            <p th:if="${publicacao.tags}" class="mt-3">
                <span class="badge text-bg-light border me-1"
                      th:each="tag : ${#strings.arraySplit(publicacao.tags, ',')}"
                      th:text="${#strings.trim(tag)}">tag</span>
            </p>

            <div class="d-flex justify-content-between mt-4">
                <a th:href="@{/publicacoes}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Voltar</a>
                <div>
                    <button type="button" class="btn btn-outline-danger" data-bs-toggle="modal" data-bs-target="#excluirModal">
                        <i class="bi bi-trash"></i> Excluir
                    </button>
                    <a th:href="@{/publicacoes/editar/{id}(id=${publicacao.id})}" class="btn btn-primary-circulo"><i class="bi bi-pencil"></i> Editar</a>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="excluirModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Confirmar exclusão</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                Tem certeza de que deseja excluir a publicação
                <strong th:text="${publicacao.titulo}"></strong>?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <form th:action="@{/publicacoes/excluir/{id}(id=${publicacao.id})}" method="post">
                    <button type="submit" class="btn btn-danger">Excluir</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
