<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${publicacao.id} ? 'Editar publicação' : 'Nova publicação'">Formulário</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/estilo.css}" rel="stylesheet">
</head>
<body>

<nav th:replace="~{fragments :: navbar}"></nav>
<div th:replace="~{fragments :: alerts}"></div>

<div class="container">
    <div class="card shadow-sm mx-auto" style="max-width: 700px;">
        <div class="card-body">
            <h3 class="card-title mb-4" th:text="${publicacao.id} ? 'Editar publicação' : 'Nova publicação'">Nova publicação</h3>

            <form th:action="${publicacao.id} ? @{/publicacoes/editar/{id}(id=${publicacao.id})} : @{/publicacoes}"
                  th:object="${publicacao}" method="post" novalidate>

                <input type="hidden" th:field="*{id}"/>

                <div class="mb-3">
                    <label class="form-label">Título *</label>
                    <input type="text" class="form-control" th:field="*{titulo}"
                           th:classappend="${#fields.hasErrors('titulo')} ? 'is-invalid'"
                           placeholder="Ex.: Como organizar meu autocuidado">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}">Erro</div>
                </div>

                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" th:field="*{anonima}" id="anonimaCheck">
                    <label class="form-check-label" for="anonimaCheck">Publicar de forma anônima</label>
                </div>

                <div class="mb-3">
                    <label class="form-label">Autora <span class="text-muted">(opcional se anônima)</span></label>
                    <input type="text" class="form-control" th:field="*{autora}"
                           th:classappend="${#fields.hasErrors('autora')} ? 'is-invalid'"
                           placeholder="Ex.: Ana">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('autora')}" th:errors="*{autora}">Erro</div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Categoria *</label>
                        <select class="form-select" th:field="*{categoria}"
                                th:classappend="${#fields.hasErrors('categoria')} ? 'is-invalid'">
                            <option value="">Selecione...</option>
                            <option th:each="c : ${categorias}" th:value="${c}"
                                    th:text="${#strings.replace(c, '_', ' ')}">Categoria</option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}">Erro</div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Status *</label>
                        <select class="form-select" th:field="*{status}"
                                th:classappend="${#fields.hasErrors('status')} ? 'is-invalid'">
                            <option value="">Selecione...</option>
                            <option th:each="s : ${statusList}" th:value="${s}"
                                    th:text="${#strings.replace(s, '_', ' ')}">Status</option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('status')}" th:errors="*{status}">Erro</div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Conteúdo *</label>
                    <textarea class="form-control" rows="6" th:field="*{conteudo}"
                              th:classappend="${#fields.hasErrors('conteudo')} ? 'is-invalid'"
                              placeholder="Escreva o relato ou a informação da publicação (20 a 2000 caracteres)"></textarea>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('conteudo')}" th:errors="*{conteudo}">Erro</div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Tags <span class="text-muted">(separadas por vírgula, opcional)</span></label>
                    <input type="text" class="form-control" th:field="*{tags}" placeholder="Ex.: autocuidado, rotina">
                </div>

                <div class="d-flex justify-content-between">
                    <a th:href="@{/publicacoes}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary-circulo">Salvar publicação</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
