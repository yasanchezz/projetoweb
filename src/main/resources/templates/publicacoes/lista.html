<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Círculo - Publicações</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/estilo.css}" rel="stylesheet">
</head>
<body>

<nav th:replace="~{fragments :: navbar}"></nav>
<div th:replace="~{fragments :: alerts}"></div>

<div class="container">

    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Publicações da comunidade</h2>
        <a th:href="@{/publicacoes/nova}" class="btn btn-primary-circulo"><i class="bi bi-plus-lg"></i> Nova publicação</a>
    </div>

    <form th:action="@{/publicacoes}" method="get" class="row g-2 mb-2 align-items-center">
        <div class="col-sm-6 col-md-4">
            <input type="text" name="titulo" class="form-control" placeholder="Pesquisar por título..."
                   th:value="${param.titulo}">
        </div>
        <div class="col-sm-6 col-md-3">
            <select name="categoria" class="form-select" onchange="this.form.submit()">
                <option value="">Todas as categorias</option>
                <option th:each="c : ${categorias}" th:value="${c}"
                        th:selected="${param.categoria != null and param.categoria[0] == c}"
                        th:text="${#strings.replace(c, '_', ' ')}">Categoria</option>
            </select>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-secondary"><i class="bi bi-search"></i> Pesquisar</button>
        </div>
        <div class="col-auto" th:if="${param.titulo or param.categoria}">
            <a th:href="@{/publicacoes}" class="btn btn-link">Limpar filtros</a>
        </div>
    </form>

    <p class="text-muted small mb-3" th:text="${#lists.size(publicacoes)} + ' publicação(ões) encontrada(s)'">0 publicações encontradas</p>

    <div class="table-responsive">
        <table class="table table-hover align-middle bg-white shadow-sm">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>
                    <a th:href="@{/publicacoes(titulo=${param.titulo}, categoria=${param.categoria}, sort='titulo', direction=${sort == 'titulo' and direction == 'asc'} ? 'desc' : 'asc')}"
                       class="text-decoration-none text-dark">
                        Título
                        <span th:if="${sort == 'titulo'}" th:text="${direction == 'asc'} ? '▲' : '▼'"></span>
                    </a>
                </th>
                <th>Categoria</th>
                <th>Autora</th>
                <th>
                    <a th:href="@{/publicacoes(titulo=${param.titulo}, categoria=${param.categoria}, sort='dataPublicacao', direction=${sort == 'dataPublicacao' and direction == 'asc'} ? 'desc' : 'asc')}"
                       class="text-decoration-none text-dark">
                        Data
                        <span th:if="${sort == 'dataPublicacao'}" th:text="${direction == 'asc'} ? '▲' : '▼'"></span>
                    </a>
                </th>
                <th>Status</th>
                <th class="text-end">Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="publicacao : ${publicacoes}">
                <td th:text="${publicacao.id}">1</td>
                <td th:text="${publicacao.anonima} ? 'Publicação anônima' : ${publicacao.titulo}">Título</td>
                <td>
                        <span class="badge rounded-pill text-bg-light border"
                              th:text="${#strings.replace(publicacao.categoria, '_', ' ')}">Categoria</span>
                </td>
                <td th:text="${publicacao.anonima} ? 'Anônima' : ${publicacao.autora}">Autora</td>
                <td th:text="${#temporals.format(publicacao.dataPublicacao, 'dd/MM/yyyy HH:mm')}">25/09/2026</td>
                <td>
                    <span th:switch="${publicacao.status}">
                        <span th:case="'PUBLICADA'" class="badge bg-success">Publicada</span>
                        <span th:case="'RASCUNHO'" class="badge bg-secondary">Rascunho</span>
                        <span th:case="'ARQUIVADA'" class="badge bg-dark">Arquivada</span>
                    </span>
                </td>
                <td class="text-end">
                    <a th:href="@{/publicacoes/{id}(id=${publicacao.id})}" class="btn btn-sm btn-outline-secondary" title="Visualizar"><i class="bi bi-eye"></i></a>
                    <a th:href="@{/publicacoes/editar/{id}(id=${publicacao.id})}" class="btn btn-sm btn-outline-primary" title="Editar"><i class="bi bi-pencil"></i></a>
                    <button type="button" class="btn btn-sm btn-outline-danger" title="Excluir"
                            data-bs-toggle="modal" th:data-bs-target="'#excluirModal' + ${publicacao.id}">
                        <i class="bi bi-trash"></i>
                    </button>

                    <div class="modal fade" th:id="'excluirModal' + ${publicacao.id}" tabindex="-1">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title">Confirmar exclusão</h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                </div>
                                <div class="modal-body">
                                    Tem certeza de que deseja excluir a publicação
                                    <strong th:text="${publicacao.titulo}"></strong>?
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                    <form th:action="@{/publicacoes/excluir/{id}(id=${publicacao.id})}" method="post">
                                        <button type="submit" class="btn btn-danger">Excluir</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>

        <div th:if="${#lists.isEmpty(publicacoes)}" class="alert alert-info">
            Nenhuma publicação encontrada.
        </div>
    </div>
</div>

<div th:replace="~{fragments :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
